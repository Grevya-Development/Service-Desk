name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npx next typegen && npx tsc --noEmit
      - name: Lint
        run: npx eslint src scripts tests
      - name: Unit tests
        # Database tests skip themselves unless a local Supabase stack is configured.
        run: npx vitest run
      - name: Build
        run: npm run build
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://example.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || 'ci-placeholder' }}
          NEXT_TELEMETRY_DISABLED: 1
